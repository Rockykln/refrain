name: release

# Triggered when a semver tag is pushed: e.g. `git tag v0.2.0 && git push --tags`
on:
  push:
    tags:
      - "v*.*.*"

# Build tools are installed unpinned, so the job that runs them only gets
# read access; the write and OIDC permissions sit on the two small
# publishing jobs below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install + run tests (gate the release)
        run: |
          python -m pip install --upgrade pip
          # System libs: dbus-python needs the *-dev headers at build
          # time; PySide6.QtWidgets needs the EGL/xkbcommon/GL/fontconfig
          # runtime libs to import (even under QT_QPA_PLATFORM=offscreen).
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev libglib2.0-dev pkg-config \
            libegl1 libxkbcommon0 libfontconfig1 libgl1
          # Install the package itself so the test imports get every
          # runtime dep (PySide6, pypresence, dbus-python) — without
          # this the new test_daemon_*.py files fail at collection.
          pip install -e ".[dev]"
          pytest -q

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          INIT_VERSION=$(python -c "import sys; sys.path.insert(0,'src'); import refrain; print(refrain.__version__)")
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$INIT_VERSION" ] || [ "$TAG" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Version mismatch — tag=v$TAG, __init__.py=$INIT_VERSION, pyproject.toml=$PYPROJECT_VERSION"
            exit 1
          fi
          echo "Releasing v$TAG"

      - name: Verify CHANGELOG has a matching entry for this tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if ! grep -qE "^## \[${TAG}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing a '## [${TAG}]' section"
            exit 1
          fi

      - name: Verify Flatpak manifest pins this tag
        # The Flatpak build source is a pinned tag — it isn't
        # rebuilt/published by this workflow (no live Flathub channel),
        # so nothing else catches it going stale. It silently sat on
        # v0.1.4 from then until v0.4.2. This gate makes a stale pin a
        # hard release failure, like the version/CHANGELOG gates above.
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          MANIFEST=packaging/flatpak/io.github.Rockykln.Refrain.yaml
          if ! grep -qE "^        tag: v${TAG}$" "$MANIFEST"; then
            echo "::error::$MANIFEST is not pinned to tag v${TAG}"
            exit 1
          fi

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build
          # Keep a clean copy of just the Python distributions for PyPI;
          # the AppImage step writes additional files into dist/ later.
          mkdir -p pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/
          ls -la pypi-dist/

      # Single-file AppImage so end users can grab one binary from the
      # Releases page and run it without installing anything else.
      # The recipe installs Refrain with the runner's /usr/bin/python3,
      # which must match the Python it bundles from Ubuntu 24.04.
      - name: Install AppImage build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip libfuse2t64 desktop-file-utils \
            zsync appstream patchelf squashfs-tools file
          # appimage-builder can't parse Ubuntu package versions with newer packaging.
          pip install appimage-builder "packaging<22"

      - name: Build AppImage
        id: appimage
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          # The recipe pins a literal `version:` value, which determines the
          # output filename (Refrain-<version>-x86_64.AppImage). Rewrite it
          # to match the tag so we don't hand-edit the recipe per release.
          sed -i -E "s/^(    version: ).*/\1${TAG}/" packaging/appimage/AppImageBuilder.yml
          grep "    version:" packaging/appimage/AppImageBuilder.yml
          cd packaging/appimage
          appimage-builder --recipe AppImageBuilder.yml --skip-test
          mkdir -p ../../dist
          mv *.AppImage ../../dist/ 2>/dev/null || true
          mv *.AppImage.zsync ../../dist/ 2>/dev/null || true
          ls -la ../../dist/

      # Every AppImage up to 0.5.2 was published without ever starting.
      - name: Start the AppImage once
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          out="$(./dist/Refrain-${TAG}-x86_64.AppImage --appimage-extract-and-run --version)"
          echo "$out"
          [ "$out" = "refrain ${TAG}" ]

      - name: Check licence notices and Qt modules in the AppImage
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          tmp="$(mktemp -d)"
          (cd "$tmp" && "$GITHUB_WORKSPACE/dist/Refrain-${TAG}-x86_64.AppImage" --appimage-extract >/dev/null)
          doc="$tmp/squashfs-root/usr/share/doc/refrain"
          grep -q "^  PySide6_Essentials " "$doc/THIRD-PARTY-NOTICES"
          grep -q "^  python3.12 " "$doc/THIRD-PARTY-NOTICES"
          test -s "$doc/LICENSE" && test -s "$doc/LICENSES/LGPL-3" && test -s "$doc/LICENSES/GPL-3"
          gpl_only="$(find "$tmp/squashfs-root" -iregex '.*\(Lottie\|WaylandCompositor\|VirtualKeyboard\|Charts\|DataVisualization\|Quick3D\|pyside6_addons\).*')"
          if [ -n "$gpl_only" ]; then
            echo "::error::GPL-only Qt parts in the AppImage:"; echo "$gpl_only"; exit 1
          fi
          rm -rf "$tmp"

      # The in-app updater refuses an AppImage whose checksum doesn't match.
      - name: Checksums for the in-app updater
        run: |
          cd dist
          sha256sum *.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the AppImage's third-party notices next to it
        run: |
          cd dist
          ./Refrain-*-x86_64.AppImage --appimage-extract usr/share/doc/refrain/THIRD-PARTY-NOTICES > /dev/null
          mv squashfs-root/usr/share/doc/refrain/THIRD-PARTY-NOTICES .
          rm -rf squashfs-root

      # Extract the matching `## [X.Y.Z]` section from CHANGELOG.md
      # and feed it into the GitHub release body. Without this we'd
      # fall back to GitHub's auto-generated "Full Changelog: …"
      # one-liner — which is also what the in-app
      # Settings → Updates → "Latest release notes" pane renders, so
      # users would only ever see the bare compare-link there.
      - name: Extract CHANGELOG section for the release body
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          # awk: print everything between `## [TAG]` and the next
          # top-level ## section, excluding the heading lines themselves.
          awk -v ver="${TAG}" '
            $0 ~ "^## \\[" ver "\\]" { p=1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > release-notes.md
          echo "::group::release-notes.md"
          cat release-notes.md
          echo "::endgroup::"
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG section for v${TAG} extracted to nothing"
            exit 1
          fi
          cat >> release-notes.md <<'NOTES'

          ---

          The AppImage bundles third-party software under its own licences; the
          list, with versions and where to get the source, is in `THIRD-PARTY-NOTICES`
          below and inside the AppImage. Versions that were taken down, and why, are
          listed in [docs/releases.md](https://github.com/Rockykln/refrain/blob/main/docs/releases.md).
          NOTES

      - name: Hand the release files to the publishing jobs
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

      - name: Hand the PyPI files to the publishing job
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: pypi-dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # required to create the release

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          # Use our CHANGELOG section (extracted above), not GitHub's
          # auto-generated notes — the in-app update dialog renders
          # this body verbatim so it has to actually be the changelog.
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}   # e.g. v0.2.0-rc1
          name: "Refrain ${{ github.ref_name }}"
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/SHA256SUMS
            dist/THIRD-PARTY-NOTICES

  pypi:
    # After the GitHub release, as before the jobs were split.
    needs: github-release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/refrain/
    permissions:
      id-token: write   # required by PyPA Trusted Publishers (OIDC) for PyPI upload

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: pypi-dist/

      # PyPI upload via Trusted Publishers (OIDC). No API token needed; the
      # one-time setup is on pypi.org → Manage → Publishing → Add a new
      # pending publisher (project: refrain, owner: Rockykln,
      # repository: refrain, workflow: release.yml, environment: pypi).
      # Skips silently if the version already exists on PyPI so re-running
      # a release for AppImage-only fixes doesn't fail the workflow.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist/
          skip-existing: true
          verbose: true
          attestations: true
