name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime + test dependencies
        # The newer tests import refrain modules that pull PySide6 /
        # pypresence / dbus-python at module load, so the runtime deps
        # have to be present in CI too.
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libglib2.0-dev pkg-config
          pip install -e ".[dev]"

      - name: Compile-check every module
        # Catches syntax errors in modules tests don't import (daemon, ui/*, sources/mpris, sources/bluetooth)
        run: python -m compileall -q src/

      - name: Run tests with coverage
        run: PYTHONPATH=src pytest --cov --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check . --output-format=github
        continue-on-error: true   # warning only — don't fail PRs on style alone

      - name: Format check with ruff
        run: ruff format --check .
        continue-on-error: true
