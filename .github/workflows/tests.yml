name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install runtime + test dependencies
        # The newer tests import refrain modules that pull PySide6 /
        # pypresence / dbus-python at module load, so the runtime deps
        # have to be present in CI too. PySide6.QtWidgets requires the
        # EGL / xkbcommon / GL / fontconfig system libs even when run
        # under QT_QPA_PLATFORM=offscreen — without them the import
        # itself fails before the test can opt out. dbus-daemon/dbus-bin
        # give tests/integration a real dbus-run-session to spin up its
        # own private bus; it skips itself if either is missing.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev libglib2.0-dev pkg-config \
            libegl1 libxkbcommon0 libfontconfig1 libgl1 \
            dbus-daemon dbus-bin
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Compile-check every module
        run: python -m compileall -q src/

      - name: Run tests with coverage
        run: PYTHONPATH=src pytest --cov --cov-report=term-missing --cov-fail-under=99

      - name: Coverage in the job summary
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        run: |
          {
            echo "### Coverage (Python ${{ matrix.python-version }}): $(coverage report --format=total)%"
            echo
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  lowest:
    # The lower bounds in pyproject.toml, on the oldest supported Python.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-lowest.txt

      - name: Install the oldest supported dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev libglib2.0-dev pkg-config \
            libegl1 libxkbcommon0 libfontconfig1 libgl1 \
            dbus-daemon dbus-bin
          pip install --require-hashes -c requirements-dev.lock pytest
          pip install -r requirements-lowest.txt
          pip install --no-deps -e .
          pip check

      - name: Run tests
        run: PYTHONPATH=src pytest

  mpris_integration:
    # Real dbus-daemon, real dbus-python, no mocks: drives MPRISSource
    # against a fake MPRIS player over a private session bus. Split out
    # from `test` so its result is its own signal; it also runs as part
    # of `test`/`lowest` above, which collect all of tests/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install runtime + test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev libglib2.0-dev pkg-config \
            libegl1 libxkbcommon0 libfontconfig1 libgl1 \
            dbus-daemon dbus-bin
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Run the MPRIS D-Bus integration tests
        run: QT_QPA_PLATFORM=offscreen PYTHONPATH=src pytest -q tests/integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install ruff
        # The version comes from requirements-dev.lock, like everywhere else.
        run: pip install --require-hashes -c requirements-dev.lock ruff

      - name: Lint with ruff
        run: ruff check . --output-format=github

      - name: Format check with ruff
        run: ruff format --check .

  typecheck:
    # The oldest supported Python, the version [tool.mypy] checks against.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install mypy and the typed runtime dependencies
        # PySide6 and pypresence ship their own type information and are
        # checked against it; dbus-python has none (see [tool.mypy]).
        run: pip install --require-hashes -c requirements-dev.lock mypy pypresence PySide6

      - name: Type-check with mypy
        run: mypy
