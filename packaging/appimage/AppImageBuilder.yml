# AppImage build recipe.
#
# Status: starting point — tested only against Ubuntu 22.04 / 24.04.
# Build:
#   pip install appimage-builder
#   cd packaging/appimage
#   appimage-builder --recipe AppImageBuilder.yml --skip-test
#
# The result is a single .AppImage file that runs Refrain on any glibc-
# compatible Linux without installing system dependencies.

version: 1

script:
  - rm -rf AppDir
  - python3 -m venv --copies --without-pip AppDir/usr
  # ensurepip installs pip as a *module*; recent Python builds skip the
  # `bin/pip` launcher script, so we always go through `python3 -m pip`.
  - AppDir/usr/bin/python3 -m ensurepip --upgrade
  - AppDir/usr/bin/python3 -m pip install --upgrade pip
  - AppDir/usr/bin/python3 -m pip install ../../  # installs refrain from the project root
  # appimage-builder's icon_bundler walks the standard XDG icon paths to
  # find the `icon:` named in app_info. Drop the SVG at the canonical
  # hicolor/scalable/apps location so it gets picked up + bundled.
  - install -Dm644 ../../src/refrain/assets/icons/refrain.svg
      AppDir/usr/share/icons/hicolor/scalable/apps/refrain.svg

AppDir:
  app_info:
    id: io.github.Rockykln.Refrain
    name: Refrain
    icon: refrain
    version: 0.4.1
    exec: usr/bin/python3
    exec_args: -m refrain $@

  apt:
    arch: amd64
    sources:
      - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ jammy main universe'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
    include:
      - python3
      - python3-dbus
      - python3-venv
      - libdbus-1-3
      - libglib2.0-0
      - libqt6core6
      - libqt6gui6
      - libqt6widgets6
      - libqt6dbus6
      - libqt6svg6
      - libqt6network6
      - libxkbcommon0
      - libegl1
      - libfontconfig1

  # files.include is intentionally absent — the icon is installed into
  # AppDir/usr/share/icons/hicolor/scalable/apps/ by the script: section
  # above, which is the path icon_bundler actually searches.

  test:
    fedora-39:
      image: appimagecrafters/tests-env:fedora-39
      command: ./AppRun --version
      use_host_x: false
    debian-stable:
      image: appimagecrafters/tests-env:debian-stable
      command: ./AppRun --version
      use_host_x: false

AppImage:
  arch: x86_64
  update-information: 'gh-releases-zsync|Rockykln|refrain|latest|*x86_64.AppImage.zsync'
  sign-key: None
  # file_name omitted on purpose — appimage-builder's {version} placeholder
  # was rendered as the literal string ".version." in v0.1.3, leaving us
  # with `Refrain-.version.-x86_64.AppImage`. The default name is
  # `<app_info.name>-<app_info.version>-<arch>.AppImage` which evaluates
  # correctly at recipe-parse time, so we use that.
