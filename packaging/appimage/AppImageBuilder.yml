# AppImage build recipe. Build on Ubuntu 24.04 — the Python that installs
# Refrain below must be the one the apt section bundles (3.12):
#   pip install appimage-builder
#   cd packaging/appimage
#   appimage-builder --recipe AppImageBuilder.yml --skip-test

version: 1

script:
  - rm -rf AppDir
  - /usr/bin/python3 -m pip install --no-deps --target AppDir/usr/lib/python3/dist-packages ../../
  # dbus-python and PyGObject come from apt, built for the bundled Python.
  - /usr/bin/python3 -m pip install --target AppDir/usr/lib/python3/dist-packages "pypresence>=4.3" "PySide6>=6.6"
  - install -Dm644 ../../src/refrain/assets/icons/refrain.svg
      AppDir/usr/share/icons/hicolor/scalable/apps/refrain.svg

AppDir:
  app_info:
    id: io.github.Rockykln.Refrain
    name: Refrain
    icon: refrain
    version: 0.5.3.dev0
    exec: usr/bin/python3
    exec_args: -m refrain $@

  apt:
    arch: amd64
    sources:
      - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ noble main universe'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
      - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ noble-updates main universe'
    include:
      - python3
      - python3-dbus
      - python3-gi
      - gir1.2-glib-2.0
      - libdbus-1-3
      - libglib2.0-0t64
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libegl1
      - libgl1
      - libfontconfig1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-keysyms1
      - libxcb-shape0

  # Ubuntu 24.04 moved the loader to /usr/lib64, but the bundled binaries
  # look for lib64/ in the runtime they are started from.
  after_runtime: |
    ln -sfn usr/lib64 AppDir/runtime/compat/lib64

AppImage:
  arch: x86_64
  update-information: 'gh-releases-zsync|Rockykln|refrain|latest|*x86_64.AppImage.zsync'
  sign-key: None
