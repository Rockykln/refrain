[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refrain"
version = "0.4.3"
description = "Discord Rich Presence for Apple Music on Linux"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
authors = [{ name = "Rockykln" }]
keywords = ["discord", "rich-presence", "apple-music", "mpris", "bluetooth", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "pypresence>=4.3",
    "dbus-python>=1.3",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "build>=1.2",
]

[project.scripts]
refrain = "refrain.app:main"

[project.urls]
Homepage = "https://github.com/Rockykln/refrain"
Repository = "https://github.com/Rockykln/refrain"
Issues = "https://github.com/Rockykln/refrain/issues"
Changelog = "https://github.com/Rockykln/refrain/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/refrain"]
# Include compiled translations + bundled assets in the wheel. Only the
# pre-compiled .qm files ship — .ts (Linguist source) files belong in
# the source tree for translators to edit, not in the runtime wheel.
artifacts = [
    "src/refrain/i18n/*.qm",
    "src/refrain/assets/**/*",
]

# ----------------------------------------------------------------------------
# Test runner
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-q --strict-markers --tb=short"
pythonpath   = ["src"]

# ----------------------------------------------------------------------------
# Coverage
# ----------------------------------------------------------------------------
[tool.coverage.run]
source = ["refrain"]
omit   = [
    "*/__init__.py",
    "*/__main__.py",
    "tests/*",
    # Modules that need Qt / D-Bus / pypresence at import time aren't
    # exercised by the in-CI test set; their syntax is checked by
    # `python -m compileall` instead. Excluding them keeps the coverage
    # number meaningful.
    "*/app.py",
    "*/daemon.py",
    "*/discord_rpc.py",
    "*/single_instance.py",
    "*/sources/mpris.py",
    "*/sources/bluetooth.py",
    "*/ui/*",
]

[tool.coverage.report]
show_missing  = true
skip_covered  = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# ----------------------------------------------------------------------------
# Linting + formatting
# ----------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py311"
extend-exclude = ["reference", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
]
ignore = [
    "E501",  # line too long — handled softly by formatter; long log strings are fine
    "B008",  # function call in default argument — harmless for our small dataclass schema
]

[tool.ruff.lint.per-file-ignores]
"tests/*"            = ["E402"]   # late imports after sys.path manipulation
"src/refrain/sources/mpris.py" = ["A003"]  # `next` shadows builtin (intentional method name)

# ----------------------------------------------------------------------------
# Bandit (Python SAST)
# ----------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "reference"]
# B404 (subprocess imp) — used only for notify-send, list-form, no shell=True
# B603 (subprocess no-shell) — same as above
# B607 (partial path) — notify-send is intentionally invoked by name (PATH lookup)
# B606 (start_process_with_no_shell) — os.execvp in app.py is the intended
#                                       Restart implementation, no shell wanted
# B310 (urlopen blacklist) — only called against hardcoded HTTPS URLs
#                            (GitHub Releases API, iTunes Search) — no
#                            user-controlled scheme exposure
# B101 (assert) — used in tests, not in src/
skips = ["B101", "B310", "B404", "B603", "B606", "B607"]
